{% extends "base.html" %}

{% block title %}
Create Note
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h1 class="mb-4">Create New Note</h1>

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('create_note') }}">
                        <div class="mb-3">
                            <label for="title" class="form-label">
                                Title
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                name="title"
                                placeholder="Enter note title"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label">
                                Content
                            </label>

                            <textarea
                                class="form-control"
                                id="content"
                                name="content"
                                rows="6"
                                placeholder="Write your note here"
                                required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Save Note
                        </button>

                        <a href="{{ url_for('notes') }}"
                           class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

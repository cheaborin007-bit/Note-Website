
{% extends "base.html" %}

{# template នេះប្រើ layout រួមពី base.html។ #}
{% block title %}
    Create Note
{% endblock %}

{% block content %}

<!-- row និង col-md-8 កំណត់ទទឹង form នៅលើអេក្រង់ធំ ហើយដាក់វាកណ្ដាល។ -->
<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card">

            <div class="card-body">

                <h1 class="mb-4">
                    Create New Note
                </h1>


                <!-- if error បង្ហាញសារ validation ពី Flask នៅពេលអ្នកប្រើបំពេញ form មិនគ្រប់។ -->
                {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                {% endif %}


                <!-- form នេះផ្ញើ data ដោយ POST ទៅ Flask route create_note។ -->
                <form
                    method="POST"
                    action="{{ url_for('create_note') }}"
                >

                    <!-- input នេះទទួល title របស់ note; required មិនអនុញ្ញាតឱ្យទុកទទេ។ -->
                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label"
                        >
                            Title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            required
                        >

                    </div>


                    <!-- select នេះអនុញ្ញាតឱ្យអ្នកប្រើជ្រើស category។ -->
                    <div class="mb-3">

                        <label
                            for="category"
                            class="form-label"
                        >
                            Category
                        </label>

                        <select
                            class="form-select"
                            id="category"
                            name="category"
                            required
                        >

                            <option value="">
                                Choose a category
                            </option>


                            {# for loop បង្កើត option មួយសម្រាប់ category នីមួយៗពី database។ #}
                            {% for category in categories %}

                                <option value="{{ category['name'] }}">
                                    {{ category['name'] }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- textarea ទទួល content វែងៗរបស់ note។ -->
                    <div class="mb-3">

                        <label
                            for="content"
                            class="form-label"
                        >
                            Content
                        </label>

                        <textarea
                            class="form-control"
                            id="content"
                            name="content"
                            rows="6"
                            required
                        ></textarea>

                    </div>


                    <!-- submit button ផ្ញើ form ទៅ server ដើម្បីរក្សាទុក note។ -->
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Note
                    </button>


                    <!-- link នេះបោះបង់ការបញ្ចូល ហើយត្រឡប់ទៅបញ្ជី notes។ -->
                    <a
                        href="{{ url_for('notes') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% extends "base.html" %}

{% block title %}Edit Category{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="mb-4">Edit Category</h1>

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST"
                          action="{{ url_for('edit_category', category_id=category['id']) }}">

                        <div class="mb-3">
                            <label for="name"
                                   class="form-label">
                                Category Name
                            </label>

                            <input type="text"
                                   id="name"
                                   name="name"
                                   class="form-control"
                                   value="{{ category['name'] }}"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary">
                            Update Category
                        </button>

                        <a href="{{ url_for('categories') }}"
                           class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

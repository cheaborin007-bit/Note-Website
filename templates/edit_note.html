
{% extends "base.html" %}

{# template នេះប្រើ base.html ហើយបង្ហាញ form សម្រាប់កែ note ដែលមានស្រាប់។ #}
{% block title %}
    Edit Note
{% endblock %}

{% block content %}

<!-- Bootstrap grid ដាក់ edit form កណ្ដាលទំព័រ។ -->
<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card">

            <div class="card-body">

                <h1 class="mb-4">
                    Edit Note
                </h1>


                <!-- បង្ហាញសារ error ប្រសិនបើ Flask បញ្ជូន variable error មក។ -->
                {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                {% endif %}


                <!-- POST form នេះផ្ញើ data ទៅ route edit_note ជាមួយ note_id របស់ note នេះ។ -->
                <form
                    method="POST"
                    action="{{ url_for('edit_note', note_id=note.id) }}"
                >

                    <!-- value="{{ note.title }}" ដាក់ title ចាស់ក្នុង input ជាមុន។ -->
                    <div class="mb-3">

                        <label
                            for="title"
                            class="form-label"
                        >
                            Title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            value="{{ note.title }}"
                            required
                        >

                    </div>


                    <!-- note.content បង្ហាញ content ចាស់ក្នុង textarea ដើម្បីឱ្យអ្នកប្រើអាចកែបាន។ -->
                    <div class="mb-3">

                        <label
                            for="content"
                            class="form-label"
                        >
                            Content
                        </label>

                        <textarea
                            class="form-control"
                            id="content"
                            name="content"
                            rows="6"
                            required
                        >{{ note.content }}</textarea>

                    </div>


                    <!-- dropdown បង្ហាញ categories ទាំងអស់ និងជ្រើស category ចាស់របស់ note។ -->
                    <div class="mb-3">

                        <label
                            for="category"
                            class="form-label"
                        >
                            Category
                        </label>

                        <select
                            class="form-select"
                            id="category"
                            name="category"
                            required
                        >
                            <option value="">Choose a category</option>

                            {% for category in categories %}

                                <option
                                    value="{{ category['name'] }}"
                                    {# if នេះដាក់ selected លើ option ដែលត្រូវនឹង category បច្ចុប្បន្នរបស់ note។ #}
                                    {% if category['name'] == note['category'] %}
                                        selected
                                    {% endif %}
                                >
                                    {{ category['name'] }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- submit button ផ្ញើ data ដែលបានកែទៅ server។ -->
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Note
                    </button>


                    <!-- Cancel ត្រឡប់ទៅទំព័រមើល note ដោយមិនផ្ញើ form។ -->
                    <a
                        href="{{ url_for('view_note', note_id=note.id) }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}

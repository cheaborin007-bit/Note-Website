{% extends "base.html" %}

{% block title %}
Edit Note
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card">
            <div class="card-body">

                <h1 class="mb-4">Edit Note</h1>

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST"
                      action="{{ url_for('edit_note', note_id=note.id) }}">

                    <div class="mb-3">
                        <label for="title" class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            name="title"
                            value="{{ note.title }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label">
                            Content
                        </label>

                        <textarea
                            class="form-control"
                            id="content"
                            name="content"
                            rows="6"
                            required>{{ note.content }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>

                        <select class="form-select"
                                id="category"
                                name="category"
                                required>

                            <option value="Study"
                                    {% if note.category == "Study" %}selected{% endif %}>
                                Study
                            </option>

                            <option value="Work"
                                    {% if note.category == "Work" %}selected{% endif %}>
                                Work
                            </option>

                            <option value="Personal"
                                    {% if note.category == "Personal" %}selected{% endif %}>
                                Personal
                            </option>

                            <option value="Ideas"
                                    {% if note.category == "Ideas" %}selected{% endif %}>
                                Ideas
                            </option>

                            <option value="General"
                                    {% if note.category == "General" %}selected{% endif %}>
                                General
                            </option>
                        </select>
                    </div>

                    <button type="submit"
                            class="btn btn-primary">
                        Update Note
                    </button>

                    <a href="{{ url_for('view_note', note_id=note.id) }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}

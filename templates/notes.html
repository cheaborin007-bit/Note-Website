{% extends "base.html" %}

{% block title %}
Notes
{% endblock %}

{% block content %}

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>My Notes</h1>

        <button class="btn btn-primary">
            + New Note
        </button>

    </div>


    {% for note in notes %}

        <div class="card mb-3">

            <div class="card-body">

                <h5 class="card-title">
                    {{ note.title }}
                </h5>

                <p class="card-text">
                    {{ note.content }}
                </p>

                <button class="btn btn-sm btn-warning">
                    Edit
                </button>

                <button class="btn btn-sm btn-danger">
                    Delete
                </button>

            </div>

        </div>

    {% endfor %}

{% endblock %}

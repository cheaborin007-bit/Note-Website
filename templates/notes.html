{% extends "base.html" %}

{% block title %}
Notes
{% endblock %}

{% block content %}

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>My Notes</h1>

        <a href="{{ url_for('create_note') }}" class="btn btn-primary">
            + New Note
        </a>

    </div>


{% for note in notes %}
    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">
                <a href="{{ url_for('view_note', note_id=note.id) }}"
                   class="text-decoration-none">
                    {{ note.title }}
                </a>
            </h5>

            <p class="card-text">
                {{ note.content }}
            </p>

            <a href="{{ url_for('view_note', note_id=note.id) }}"
               class="btn btn-sm btn-info text-white">
                View
            </a>
        </div>
    </div>
{% endfor %}

{% endblock %}

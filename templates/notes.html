{% extends "base.html" %}

{% block title %}
Notes
{% endblock %}

{% block content %}

<h1 class="mb-4">My Notes</h1>

    <a href="{{ url_for('create_note') }}" class="btn btn-primary">
        + New Note
    </a>

{% for note in notes %}

    <div class="card mb-3">
        <div class="card-body">

            <h5 class="card-title">
                <a href="{{ url_for('view_note', note_id=note.id) }}"
                   class="text-decoration-none">
                    {{ note.title }}
                </a>
            </h5>

            <p class="card-text">
                {{ note.content }}
            </p>

            <div class="mt-3">

                <!-- View -->
                <a href="{{ url_for('view_note', note_id=note.id) }}"
                   class="btn btn-sm btn-info text-white">
                    View
                </a>

                <!-- Edit -->
                <a href="{{ url_for('edit_note', note_id=note.id) }}"
                   class="btn btn-sm btn-warning">
                    Edit
                </a>

                <!-- Delete -->
                <form method="POST"
                      action="{{ url_for('delete_note', note_id=note.id) }}"
                      class="d-inline"
                      onsubmit="return confirm('Are you sure you want to delete this note?');">

                    <button type="submit"
                            class="btn btn-sm btn-danger">
                        Delete
                    </button>

                </form>

            </div>

        </div>
    </div>

{% endfor %}

{% endblock %}

{% extends "base.html" %}

{% block title %}
{{ note.title }}
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="card-title mb-3">
                        {{ note.title }}
                    </h1>

                    <p class="text-muted">
                        Note ID: {{ note.id }}
                    </p>

                    <hr>

                    <p class="card-text">
                        {{ note.content }}
                    </p>

                    <a href="{{ url_for('edit_note', note_id=note.id) }}"
                        class="btn btn-warning">
                        Edit
                    </a>

                    <a href="{{ url_for('notes') }}"
                       class="btn btn-secondary">
                        Back to Notes
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
